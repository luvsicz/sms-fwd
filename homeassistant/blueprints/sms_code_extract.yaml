blueprint:
  name: 短信转发器 - 验证码提取通知
  description: 自动提取短信中的验证码，并发送优化后的通知
  domain: automation
  
  input:
    sms_content_entity:
      name: 短信内容传感器
      description: 选择短信转发器的"最近短信内容"传感器
      selector:
        entity:
          domain: sensor
    
    notify_service:
      name: 通知服务
      description: 选择要发送通知的服务
      selector:
        select:
          options:
            - notify.mobile_app_wvw
            - notify.persistent_notification
          custom_value: true
      default: "notify.mobile_app_wvw"

variables:
  sms_entity: !input sms_content_entity

trigger:
  - platform: state
    entity_id: !input sms_content_entity

condition:
  # 忽略状态变为 unavailable/unknown 的情况
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', 'none', ''] }}"

action:
  - variables:
      sender: "{{ state_attr(sms_entity, 'sender') | default('未知') }}"
      message: "{{ state_attr(sms_entity, 'message') | default(states(sms_entity)) }}"
      # 提取4-8位数字验证码
      code: >-
        {% set msg = message %}
        {% set ns = namespace(code='') %}
        {% set patterns = ['验证码', '校验码', '动态码', 'code', 'CODE', '码'] %}
        {% for pattern in patterns %}
          {% if pattern in msg and ns.code == '' %}
            {% set matches = msg | regex_findall('[0-9]{4,8}') %}
            {% if matches %}
              {% set ns.code = matches[0] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.code }}
  
  - choose:
      # 如果提取到验证码，发送简洁通知
      - conditions:
          - condition: template
            value_template: "{{ code != '' }}"
        sequence:
          - service: !input notify_service
            data:
              title: "🔑 验证码: {{ code }}"
              message: "来自 {{ sender }}"
              data:
                push:
                  sound: default
                tag: "sms_code_{{ sender }}"
    
    # 否则发送原始短信
    default:
      - service: !input notify_service
        data:
          title: "📱 {{ sender }}"
          message: "{{ message }}"
          data:
            push:
              sound: default
            tag: "sms_{{ sender }}"

mode: queued
max: 10
