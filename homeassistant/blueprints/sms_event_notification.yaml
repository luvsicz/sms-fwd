blueprint:
  name: 短信转发器 - 收到短信通知（事件版）
  description: 基于 Home Assistant 事件实体触发。当短信转发器收到新短信事件时，发送通知到手机或其他设备。
  domain: automation

  input:
    sms_event_entity:
      name: 短信事件实体
      description: 选择短信转发器自动发现或手工配置的“短信通知”事件实体
      selector:
        entity:
          domain: event

    notify_service:
      name: 通知服务
      description: 选择要发送通知的服务（如 notify.mobile_app_xxx）
      selector:
        select:
          options:
            - notify.mobile_app_wvw
            - notify.persistent_notification
          custom_value: true
      default: "notify.mobile_app_wvw"

    filter_sender:
      name: 过滤发送者（可选）
      description: 只有指定号码发来的短信才通知，留空则全部通知。多个号码用逗号分隔
      default: ""
      selector:
        text:

variables:
  filter_sender: !input filter_sender

trigger:
  - platform: state
    entity_id: !input sms_event_entity

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', 'none', ''] }}"
  - condition: template
    value_template: >-
      {% set sender = trigger.to_state.attributes.sender | default('') %}
      {% if filter_sender == '' %}
        true
      {% else %}
        {{ sender in filter_sender.split(',') | map('trim') | list }}
      {% endif %}

action:
  - variables:
      sender: "{{ trigger.to_state.attributes.sender | default('未知') }}"
      message: "{{ trigger.to_state.attributes.message | default('') }}"
      time: "{{ trigger.to_state.attributes.time | default(trigger.to_state.attributes.timestamp | default('')) }}"
  - service: !input notify_service
    data:
      title: "📱 {{ sender }}"
      message: >-
        {% if time != '' %}
          {{ message }}

          时间：{{ time }}
        {% else %}
          {{ message }}
        {% endif %}
      data:
        push:
          sound: default
        tag: "sms_{{ sender }}"

mode: queued
max: 10

